<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img class="brand-mark" src="assets/images/Logo.png" alt="WorkHub logo" />
      <span class="login-badge">Password reset</span>
      <h1 class="login-title">Reset password</h1>
      <p class="login-subtitle">
        Enter the 6-digit code we emailed to <span class="subtitle-emphasis">{{ pendingResetEmail() }}</span> and choose a new password.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }

      <div class="field">
        <label class="field-label" for="otp">Verification code</label>
        <input
          id="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          class="field-input otp-input"
          formControlName="otp"
          placeholder="######"
          autofocus
        />
      </div>

      <div class="field">
        <label class="field-label" for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          class="field-input"
          formControlName="newPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>

      <div class="field">
        <label class="field-label" for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          type="password"
          class="field-input"
          formControlName="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        @if (form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched) {
          <p class="field-hint-error">Passwords do not match</p>
        }
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Updating…' : 'Reset password' }}
      </button>

      <button
        type="button"
        class="resend-btn"
        [disabled]="resendCooldown() > 0"
        aria-live="polite"
        (click)="resend()"
      >
        {{ resendCooldown() > 0 ? 'Resend code in ' + resendCooldown() + 's' : 'Resend code' }}
      </button>
    </form>

    <a routerLink="/login" class="back-link">Back to sign in</a>
  </div>
</div>

<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img class="brand-mark" src="assets/images/Logo.png" alt="WorkHub logo" />
      <span class="login-badge">Password reset</span>
      <h1 class="login-title">Forgot password</h1>
      <p class="login-subtitle">Enter your email and we'll send you a verification code to reset it.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="field-input"
          formControlName="email"
          placeholder="you@company.com"
          autocomplete="email"
          autofocus
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Sending…' : 'Send code' }}
      </button>
    </form>

    <a routerLink="/login" class="back-link">Back to sign in</a>
  </div>
</div>
